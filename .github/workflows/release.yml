name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build darwin binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/skeleton-darwin-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/skeleton-darwin-amd64 .
      - name: Smoke test (arm64 native)
        run: ./dist/skeleton-darwin-arm64 internal/lang/detect.go
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build linux binary
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o dist/skeleton-linux-amd64 .
      - name: Smoke test
        run: ./dist/skeleton-linux-amd64 internal/lang/detect.go
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
